server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The comparison deck, and under it the base build its "before" pane frames (an app
    # with history routing of its own).
    location /side-by-side {
        try_files $uri $uri/index.html /side-by-side/index.html;
    }
    location /side-by-side/before/ {
        try_files $uri /side-by-side/before/index.html;
    }

    # The service worker and its entry page must never be cached, or browsers
    # keep running an old deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
